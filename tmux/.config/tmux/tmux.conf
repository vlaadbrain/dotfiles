# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -s set-clipboard on

set -g base-index 1
set -g pane-base-index 1

set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

set -g escape-time 0
set -g repeat-time 1000
set -g history-limit 10000

set -g extended-keys on
set -g extended-keys-format csi-u

set -g set-titles on
set -g set-titles-string "#W | #T"

# split panes using | and -
unbind '"'
unbind %

bind | split-window -h
bind h split-window -h

bind - split-window -v
bind v split-window -v

bind f resize-pane -Z

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=color009'
set -g pane-active-border-style 'fg=color009'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'bg=default,fg=color009'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=color000 bg=color006'
set -g status-right ' #H '
set -g status-right-length 50

setw -g window-status-current-style 'fg=color009 bg=color000'
setw -g window-status-current-format ' #[fg=color005]#I #[fg=color007]./#{b:pane_current_path}#[fg=color009][#W] #F '

setw -g window-status-style 'fg=color006 bg=color008'
setw -g window-status-format ' #[fg=color005]#I #[fg=color012]#{b:pane_current_path}[#W] #[fg=color006]#F '

setw -g window-status-bell-style 'fg=color003 bg=color001'

# messages
set -g message-style 'fg=color003 bg=color001'

set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux=plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

run '~/.config/tmux/plugins/tpm/tpm'
